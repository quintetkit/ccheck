name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    # **`engines` に書いた下限を回す。** ここが 25 だけだったとき、
    # `>=22.18` という宣言を一度も試していなかった。
    # dev.to のコメントで指摘されて気づいた（「25 で通っても 22.18 の主張は検証できない」）。
    strategy:
      matrix:
        node: ["22.18", "25"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ matrix.node }}" }
      # 依存パッケージが無いので install は要らない
      - name: テスト
        run: node --experimental-strip-types test/run.ts

  cli:
    # 配布するのは CLI なので、テスト関数ではなく CLI そのものを叩いて
    # 終了コードまで確かめる。動かないものは配らない。
    # **下限でも叩く**（型剥ぎ実行の挙動が版で違うため）
    strategy:
      matrix:
        node: ["22.18", "25"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ matrix.node }}" }
      - name: 正しい設定では何も言わないこと
        run: node --experimental-strip-types src/cli.ts test/fixtures/clean --strict
      - name: 壊れた設定では 1 で終わること
        run: |
          set +e
          node --experimental-strip-types src/cli.ts test/fixtures/broken
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "壊れた設定なのに終了コードが $code でした（期待 1）"
            exit 1
          fi

  action:
    # composite action として呼べることまで確かめる
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '25' }
      - uses: ./
        with:
          path: test/fixtures/clean

  published-tag:
    # 公開されているタグ経由で本当に使えるかを毎回確かめる。
    # main では動くのにタグでは壊れている、という事故を防ぐため。
    # （このジョブは v1 を打った後でないと必ず落ちる。初回リリース前は入れないこと）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: '25' }
      - uses: actions/checkout@v5
        with: { path: fixtures }
      - uses: quintetkit/ccheck@v1
        with:
          path: fixtures/test/fixtures/clean
          strict: "true"
